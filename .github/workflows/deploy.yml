name: Deploy

# 部署流水线（学习 CD 的参考实现）：
# 1. main 分支推送 → 先在"生产数据库"执行 Prisma 迁移（migrate deploy）
# 2. 迁移成功后再触发 Vercel 部署（通过 Vercel Git Integration 或本工作流调用 vercel CLI）
#
# 注意：这里选择"先在 CI 跑迁移、再构建部署"，保证新代码不会跑到旧表结构上。
# 更稳妥的实践是配合"迁移前置预览/回滚"，可在团队评审后逐步引入。

on:
  push:
    branches: [main]
  workflow_dispatch: # 手动触发

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # 部署任务不互相取消，保证数据库迁移顺序

jobs:
  migrate:
    name: Database Migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Migrate Deploy
        env:
          # 迁移必须使用直连地址（绕过连接池）
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Mark migration done
        run: echo "migration ok"

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: migrate
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Pull Vercel Environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build Project Artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
